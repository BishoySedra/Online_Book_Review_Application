name: Tests

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    test:
        name: Run unit tests (Bun)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Run tests
              env:
                  NODE_ENV: test
                  SALT_ROUNDS: "10"
                  TOKEN_SECRET_KEY: "test_secret_key_ci"
              run: bun run test
